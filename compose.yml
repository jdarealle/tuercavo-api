# Compose predeterminado para desarrollo local; credenciales de ejemplo conocidas.
name: tuercavo
services:
  postgres:
    image: docker.io/library/postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tuercavo_dev}
      POSTGRES_USER: ${POSTGRES_USER:-tuercavo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tuercavo_dev_password}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --locale-provider=libc
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      # PostgreSQL 18 usa /var/lib/postgresql/18/docker dentro de este volumen.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
volumes:
  postgres_data:
