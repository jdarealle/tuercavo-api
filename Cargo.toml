[workspace]
members = ["api", "auth", "common", "modules", "db/migration", "db/entity"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
authors = ["JD"]
readme = "README.md"

[workspace.dependencies]
sea-orm = { version = "2.0.3", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "debug-print"] }
sea-orm-migration = { version = "=2.0.2", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }

axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
base64 = "0.22.1"
getrandom = "0.4.3"
sha2 = "0.10.9"
time = "0.3.55"
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2.0"
scalar_api_reference = "0.2.2"
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1.43"
email_address = "0.2"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15.7"
