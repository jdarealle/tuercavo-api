[workspace]
members = ["db/migration"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
authors = ["JD"]
readme = "README.md"

[workspace.dependencies]
sea-orm-migration = { version = "=2.0.2", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
